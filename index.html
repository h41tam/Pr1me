<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202020">
<meta name="color-scheme" content="dark">
<meta name="description" content="A community-supported experiment from Morocco. Follow the journey of building PR1ME from almost nothing.">
<title>PR1ME — Can We Build a Digital Agency From Almost Nothing?</title>
<style>
/* ===== PR1ME V2 — single static file. Config lives at the top of the <script>. ===== */
@font-face{font-family:"TAN Pearl";src:url("assets/TAN-Pearl-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
:root{--black:#202020;--light:#E0E0E0;--gold:#C3A330;--gold-d:#7a6410;--muted:#9a9a9a;--line:rgba(224,224,224,.15);--ease:cubic-bezier(.22,1,.36,1);--hh:64px;--gap:clamp(90px,12vw,160px)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--black);scroll-behavior:smooth;scroll-padding-top:calc(var(--hh) + 16px);overflow-x:clip}
body{min-width:320px;background:var(--black);color:var(--light);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Roboto,Helvetica,Arial,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
body.ld{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
::selection{background:var(--gold);color:var(--black)}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
em{font-style:normal;color:var(--gold)}
.tan{font-family:"TAN Pearl",Georgia,serif;font-weight:400}
.gold{color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.wrap{width:calc(100% - 40px);max-width:1180px;margin-inline:auto}
html[dir=rtl] *{letter-spacing:0!important}
html[dir=rtl] .tan{font-family:inherit;font-weight:800}

/* reveals */
.rv,.hv{opacity:0;transform:translateY(28px);transition:opacity .85s var(--ease),transform .85s var(--ease)}
.rv.in,.hv.in{opacity:1;transform:none}
.lr{transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease)}
html[dir=rtl] .lr{transform-origin:right}
.lr.in{transform:none}

/* loader */
#loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--black);transition:opacity .8s var(--ease),visibility .8s}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.ld-in{display:grid;justify-items:center;gap:22px}
.ld-in img{width:104px;opacity:0;animation:fin .9s var(--ease) .1s forwards}
.ld-in i{display:block;width:80px;height:1px;background:rgba(224,224,224,.12);overflow:hidden}
.ld-in i::after{content:"";display:block;height:100%;background:var(--gold);transform:translateX(-100%);animation:ldl 1.2s var(--ease) .3s forwards}
@keyframes fin{to{opacity:1}}
@keyframes ldl{to{transform:none}}

/* header */
header{position:fixed;inset:0 0 auto;z-index:1000;height:var(--hh);border-bottom:1px solid transparent;transition:background .4s,border-color .4s,height .4s var(--ease)}
header.sc{height:56px;background:rgba(32,32,32,.92);border-color:var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nav{width:calc(100% - 40px);max-width:1180px;height:100%;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{width:76px;height:auto}
.ls{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:99px;background:rgba(32,32,32,.55)}
.ls button{min-width:38px;min-height:30px;padding:0 9px;border:0;border-radius:99px;background:none;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.06em;cursor:pointer;transition:color .25s,background .25s}
.ls button:hover{color:var(--light)}
.ls button[aria-pressed=true]{background:var(--gold);color:var(--black)}

/* hero */
.hero{min-height:100svh;padding:calc(var(--hh) + 32px) 0 28px;display:flex;flex-direction:column;justify-content:center}
.bip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:26px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.bip>span{display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(195,163,48,.45)}70%,100%{box-shadow:0 0 0 8px rgba(195,163,48,0)}}
.day{padding-inline-start:14px;border-inline-start:1px solid var(--line);color:var(--light)}
.day b{color:var(--gold);font-size:15px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.ht{font-size:min(11vw,80px);font-weight:800;letter-spacing:-.055em;line-height:.93;text-transform:uppercase}
.hl{display:block;overflow:hidden;padding-block:.04em}
.hl>span{display:block;transform:translateY(112%);opacity:0}
.ht.go .hl>span{animation:up .95s var(--ease) forwards}
.ht.go .hl:nth-child(2)>span{animation-delay:.12s}
.ht.go .hl:nth-child(3)>span{animation-delay:.24s}
@keyframes up{to{transform:none;opacity:1}}
.ht .tan{letter-spacing:-.04em; font-size: 0.75em}
html[lang=fr] .ht{font-size:min(9.4vw,72px)}
html[lang=ar] .ht{font-size:min(10vw,80px);line-height:1.25}
.sub{max-width:520px;margin-top:30px;color:var(--muted);font-size:15px;line-height:1.7}
.hb{display:grid;gap:28px;margin-top:38px}
.ml{margin-bottom:8px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.mn{font-size:clamp(46px,13vw,92px);font-weight:800;letter-spacing:-.065em;line-height:.95}
.pw{max-width:580px;margin-top:18px}
.pt{position:relative;height:2px;background:rgba(224,224,224,.14)}
.pt::before{content:"";position:absolute;inset-inline-start:0;top:-4px;width:2px;height:10px;background:var(--gold)}
.pf{height:100%;width:0;background:var(--gold);transition:width 1.4s var(--ease)}
.pl{display:flex;justify-content:space-between;gap:16px;margin-top:11px;color:var(--muted);font-size:10px;letter-spacing:.12em}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:52px;padding:10px 22px;border:1px solid rgba(224,224,224,.3);background:none;color:var(--light);font-size:10px;font-weight:800;letter-spacing:.16em;line-height:1.3;text-align:center;text-transform:uppercase;cursor:pointer;transition:background .35s,color .35s,border-color .35s,transform .35s var(--ease)}
.cta:hover{background:var(--gold);border-color:var(--gold);color:var(--black);transform:translateY(-3px)}
.cta[aria-disabled=true]{opacity:.45;pointer-events:none;cursor:not-allowed}
.hb .cta{width:100%}
.scr{align-self:center;margin-top:38px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;transition:opacity .5s,transform .5s var(--ease),visibility .5s}
.scr.off{opacity:0;visibility:hidden;transform:translateY(10px)}
.scr i{width:1px;height:30px;background:rgba(224,224,224,.15);overflow:hidden}
.scr i::after{content:"";display:block;height:50%;background:var(--gold);animation:sl 1.9s ease-in-out infinite}
@keyframes sl{0%,100%{transform:translateY(-100%)}50%{transform:translateY(100%)}}

/* sections */
.sec{padding-block:var(--gap);border-top:1px solid var(--line)}
.sn{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.sl{height:1px;margin-block:14px 44px;background:var(--line)}
h2{font-size:clamp(34px,9vw,100px);font-weight:800;letter-spacing:-.055em;line-height:.92;text-transform:uppercase;overflow-wrap:break-word}
html[lang=ar] h2,html[lang=ar] .ft{line-height:1.2}
.cp1{max-width:610px;margin-top:50px;margin-inline-start:auto;color:var(--muted);font-size:16px;line-height:1.85}
.cp1 p+p{margin-top:22px}
.cp1 strong{color:var(--light)}
.idea h2{max-width:1050px;font-size:clamp(28px,6vw,72px)}
.huge{margin-top:6px;color:rgba(224,224,224,.07);font-size:clamp(84px,21vw,250px);font-weight:800;letter-spacing:-.08em;line-height:.85;transition:color 1.2s}
.huge.in{color:var(--light)}
.cur{margin-top:14px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.al{margin-top:50px;border-top:1px solid var(--line)}
.al div{display:grid;grid-template-columns:100px 1fr;gap:18px;padding-block:22px;border-bottom:1px solid var(--line)}
.al b{color:var(--gold);font-size:13px;white-space:nowrap}
.al span{font-size:15px;font-weight:700}
.note{max-width:620px;margin-block:30px 24px;color:var(--muted);font-size:13px;line-height:1.7}
.svc{margin-top:60px;border-top:1px solid var(--line)}
.svc>div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding-block:26px;border-bottom:1px solid var(--line);transition:padding .45s var(--ease)}
.svc>div:hover{padding-inline-start:8px}
.svc b{padding-top:8px;color:var(--gold);font-size:10px}
.svc h3{font-size:clamp(28px,6vw,56px);font-weight:800;letter-spacing:-.04em;line-height:1;text-transform:uppercase}
.svc p{margin-top:9px;color:var(--muted);font-size:13px}
.st{max-width:900px;margin-top:90px;font-size:clamp(24px,5vw,50px);line-height:1.08;letter-spacing:-.035em}
.st strong{color:var(--gold);font-weight:400}

/* timeline — one coherent system: track + progress + dots only, no stray backgrounds */
.tl{position:relative;margin-top:60px}
.tl::before,.tlp{content:"";position:absolute;top:0;inset-inline-start:14px;width:1px}
.tl::before{bottom:0;background:var(--line)}
.tlp{height:0;background:rgba(224,224,224,.45);transition:height .2s linear}
.ti{position:relative;padding:0 0 54px;padding-inline-start:50px}
.td{position:absolute;top:4px;inset-inline-start:8px;width:13px;height:13px;border:1px solid var(--muted);border-radius:50%;background:var(--black);transition:border-color .4s}
.ti.seen .td{border-color:var(--light)}
.ti.done .td{background:var(--gold);border-color:var(--gold)}
.ti.unk .td{border-style:dashed}
.tn0{color:var(--gold);font-size:11px;letter-spacing:.15em}
.tn{margin-top:8px;font-size:clamp(27px,7vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1;opacity:.4;transition:opacity .6s}
.ti.seen .tn,.ti.done .tn{opacity:1}
.ts{margin-top:12px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.ti.done .ts{color:var(--gold)}

/* transparency (light inverted section) */
.tr{background:var(--light);color:var(--black);border-top:0}
.tr .sn{color:var(--gold-d)}
.tr .sl{background:rgba(32,32,32,.2)}
.tr em{color:var(--gold-d)}
.tr p.cp{max-width:500px;margin-top:40px;font-size:17px;line-height:1.6}
.stats{margin-top:60px}
.stat{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-block:24px;border-top:1px solid rgba(32,32,32,.2)}
.stat:last-child{border-bottom:1px solid rgba(32,32,32,.2)}
.stat span{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.stat b{font-size:clamp(25px,6vw,44px);font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.tr .cta{margin-top:36px;border-color:rgba(32,32,32,.4);color:var(--black)}
.tr .cta:hover{background:var(--black);border-color:var(--black);color:var(--light)}
.soon{margin-top:12px;font-size:12px;opacity:.7}

/* support */
.sg{display:grid;gap:1px;margin-top:56px;background:var(--line);border:1px solid var(--line)}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:28px 20px;background:var(--black);transition:background .4s}
.card:hover{background:#262626}
.cn{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.12em}
.card h3{font-size:clamp(23px,5.4vw,34px);font-weight:800;letter-spacing:-.035em;line-height:1.05;text-transform:uppercase}
.cd{max-width:480px;color:var(--muted);font-size:14px;line-height:1.7}
.card .cta{width:100%}
.tabs{display:grid;gap:6px;width:100%;margin-top:6px}
.tabs button{min-height:48px;padding:0 16px;border:1px solid var(--line);background:none;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.14em;text-align:start;text-transform:uppercase;cursor:pointer;transition:all .3s}
.tabs button:hover{color:var(--light);border-color:rgba(224,224,224,.35)}
.tabs button[aria-selected=true]{border-color:var(--gold);background:rgba(195,163,48,.1);color:var(--gold)}
.panel{width:100%}
.fld{padding-block:14px;border-top:1px solid var(--line)}
.fl{display:block;margin-bottom:7px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fv{flex:1;min-width:0;direction:ltr;unicode-bidi:isolate;text-align:start;font-size:clamp(15px,4.4vw,19px);font-weight:700;letter-spacing:.03em;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
html[dir=rtl] .fv{text-align:right}
.cp{flex:0 0 auto;min-width:96px;min-height:42px;padding:0 12px;border:1px solid rgba(224,224,224,.3);background:none;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.cp:hover{border-color:var(--gold);color:var(--gold)}
.cp.ok{background:var(--gold);border-color:var(--gold);color:var(--black)}
.priv{padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
.url{font-size:14px;font-weight:700;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.soc{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px 28px}
.lnk{display:inline-flex;padding-bottom:6px;border-bottom:1px solid var(--gold);font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;transition:color .25s}
.lnk:hover{color:var(--gold)}

/* final + footer */
.fin{min-height:80svh;display:flex;align-items:center}
.ft{font-size:clamp(50px,14vw,160px);font-weight:800;letter-spacing:-.075em;line-height:.84}
.ft span{display:block}
.fm{margin-top:64px;display:grid;justify-items:start;gap:18px}
.fq{font-size:30px;letter-spacing:-.04em}
footer{padding:26px 0 36px;border-top:1px solid var(--line)}
.fi{display:flex;flex-direction:column;gap:14px}
.fi img{width:64px}
.fi p{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}

@media(min-width:600px){.tabs{grid-template-columns:repeat(3,1fr)}.al{display:grid;grid-template-columns:1fr 1fr}.al div:nth-child(even){padding-inline-start:25px;border-inline-start:1px solid var(--line)}}
@media(min-width:900px){
 :root{--hh:72px}
 .ht{font-size:min(6.9vw,92px)}
 html[lang=fr] .ht{font-size:min(4.9vw,72px)}
 html[lang=ar] .ht{font-size:min(6.4vw,84px)}
 .hl>span{white-space:nowrap}
 .hb{grid-template-columns:minmax(0,1fr) auto;align-items:end;margin-top:48px}
 .hb .cta{width:auto;min-width:260px}
 .card{padding:36px 32px}
 .sg{grid-template-columns:1.45fr 1fr}
 .card.main{grid-row:span 2}
 .card .cta{width:auto}
 .fi{flex-direction:row;justify-content:space-between;align-items:center}
}
@media(max-width:380px){.cta{letter-spacing:.1em;padding-inline:14px}.cp{min-width:88px}}
@media(prefers-reduced-motion:reduce){
 *,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
 .dot,.scr i::after{animation:none}
 .rv,.hv{transform:none}
}
</style>
</head>
<body class="ld">

<div id="loader" aria-hidden="true"><div class="ld-in"><img src="assets/pr1me-dark.svg" alt=""><i></i></div></div>

<header id="header">
  <nav class="nav" aria-label="Main">
    <a href="#top" class="logo-link"><img src="assets/pr1me-main.png" alt="PR1ME" class="logo"></a>
    <div class="ls" role="group" aria-label="Language">
      <button type="button" data-l="en" lang="en">EN</button>
      <button type="button" data-l="ar" lang="ar">عربي</button>
      <button type="button" data-l="fr" lang="fr">FR</button>
    </div>
  </nav>
</header>
<p class="sr" id="live" aria-live="polite"></p>

<main id="top">

<!-- HERO -->
<section class="hero">
  <div class="wrap">
    <div class="bip hv">
      <span><i class="dot"></i><span data-i="bip"></span></span>
      <span class="day"><span data-i="day"></span> <b id="dayNum">01</b></span>
    </div>
    <h1 class="ht">
      <span class="hl"><span data-i="h1"></span></span>
      <span class="hl"><span data-i="h2"></span></span>
      <span class="hl"><span><span data-i="h3a"></span> <span class="tan gold" data-i="h3b"></span></span></span>
    </h1>
    <p class="sub hv" data-i="sub"></p>
    <div class="hb">
      <div class="hv">
        <div class="ml" data-i="ms"></div>
        <div class="mn">5,000 DH</div>
        <div class="pw">
          <div class="pt" role="progressbar" aria-valuemin="0" aria-valuemax="5000" aria-valuenow="0" aria-valuetext="0 DH / 5,000 DH"><div class="pf" style="width:0%"></div></div>
          <div class="pl"><span>0 DH</span><span>5,000 DH</span></div>
        </div>
      </div>
      <a href="#support" class="cta hv" data-i="cta"></a>
    </div>
  </div>
  <div class="scr" id="scr" aria-hidden="true"><i></i><span data-i="scr"></span></div>
</section>

<!-- 01 IDEA -->
<section class="sec idea" id="idea"><div class="wrap">
  <div class="sn rv" data-i="n1"></div><div class="sl lr"></div>
  <h2 class="rv" data-i="t1"></h2>
  <div class="cp1 rv"><p data-i="p1"></p><p data-i="p2"></p><p data-i="p3"></p></div>
</div></section>

<!-- 02 MILESTONE -->
<section class="sec" id="milestone"><div class="wrap">
  <div class="sn rv" data-i="n2"></div><div class="sl lr"></div>
  <div class="huge rv">5,000</div>
  <div class="cur rv"><span data-i="prg"></span>: 0 DH / 5,000 DH</div>
  <div class="al rv">
    <div><b>3,000 DH</b><span data-i="a1"></span></div>
    <div><b>2,000 DH</b><span data-i="a2"></span></div>
  </div>
  <p class="note rv" data-i="doc"></p>
  <a href="#transparency" class="cta rv" data-i="c2"></a>
</div></section>

<!-- 03 LAPTOP -->
<section class="sec" id="laptop"><div class="wrap">
  <div class="sn rv" data-i="n3"></div><div class="sl lr"></div>
  <h2 class="rv" data-i="t3"></h2>
  <div class="cp1 rv" style="margin-inline-start:0"><p data-i="l1"></p><p data-i="l2"></p><p data-i="l3"></p></div>
</div></section>

<!-- 04 SERVICES -->
<section class="sec" id="services"><div class="wrap">
  <div class="sn rv" data-i="n4"></div><div class="sl lr"></div>
  <h2 class="rv">PR<em>1</em>ME</h2>
  <div class="svc">
    <div class="rv"><b>01</b><div><h3 data-i="s1"></h3><p data-i="d1"></p></div></div>
    <div class="rv"><b>02</b><div><h3 data-i="s2"></h3><p data-i="d2"></p></div></div>
    <div class="rv"><b>03</b><div><h3 data-i="s3"></h3><p data-i="d3"></p></div></div>
    <div class="rv"><b>04</b><div><h3 data-i="s4"></h3><p data-i="d4"></p></div></div>
  </div>
  <p class="st tan rv" data-i="st"></p>
</div></section>

<!-- 05 TIMELINE -->
<section class="sec" id="build"><div class="wrap">
  <div class="sn rv" data-i="n5"></div><div class="sl lr"></div>
  <h2 class="rv" data-i="t5"></h2>
  <div class="tl" id="tl">
    <div class="tlp" id="tlp"></div>
    <div class="ti done rv"><i class="td"></i><div class="tn0">00</div><div class="tn" data-i="k0"></div><div class="ts" data-i="u0"></div></div>
    <div class="ti rv"><i class="td"></i><div class="tn0">01</div><div class="tn" data-i="k1"></div><div class="ts" data-i="u1"></div></div>
    <div class="ti rv"><i class="td"></i><div class="tn0">02</div><div class="tn" data-i="k2"></div><div class="ts" data-i="u1"></div></div>
    <div class="ti rv"><i class="td"></i><div class="tn0">03</div><div class="tn" data-i="k3"></div><div class="ts" data-i="u1"></div></div>

/* ---------- Copy (Clipboard API + fallback, inline confirmation) ---------- */
async function copyText(text) {
 try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
 try {
  const a = document.createElement("textarea");
  a.value = text; a.setAttribute("readonly", ""); a.style.cssText = "position:fixed;top:0;opacity:0";

  const ok = document.execCommand("copy"); a.remove(); return ok;
 } catch (e) { return false; }
}
